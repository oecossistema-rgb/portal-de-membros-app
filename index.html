    <!-- Tela de abertura do app instalado (some sozinha quando o portal carrega). -->
    <style>
      #abertura{ position:fixed; inset:0; z-index:2147483000; display:none; flex-direction:column; align-items:center; justify-content:center;
        background:radial-gradient(circle at 50% 44%, #163a20 0, #0b1a0f 200px, #050806 420px); transition:opacity .45s ease, visibility .45s ease;
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif }
      @media (display-mode: standalone), (display-mode: fullscreen){ #abertura{ display:flex } }
      html.app-instalado #abertura{ display:flex }
      #abertura.saindo{ opacity:0; visibility:hidden }
      #abertura .ab-anel{ position:relative; width:168px; height:168px; animation:ab-entra .9s cubic-bezier(.2,.8,.2,1) both }
      #abertura .ab-anel::before{ content:""; position:absolute; inset:-34px; border-radius:50%; background:radial-gradient(circle, rgba(140,210,100,.32) 0, rgba(140,210,100,0) 68%); animation:ab-brilho 2.2s ease-in-out .5s infinite }
      #abertura .ab-logo{ position:relative; width:100%; height:100%; display:block }
      #abertura .ab-1{ margin-top:30px; color:#cfe7b8; letter-spacing:.6em; padding-left:.6em; font-size:13px; font-weight:600; animation:ab-texto .8s ease .35s both }
      #abertura .ab-2{ margin-top:6px; color:#fff; letter-spacing:.08em; font-size:22px; font-weight:800; animation:ab-texto .8s ease .5s both }
      #abertura .ab-barra{ margin-top:34px; width:120px; height:3px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; animation:ab-texto .6s ease .7s both }
      #abertura .ab-barra i{ display:block; width:40%; height:100%; border-radius:3px; background:linear-gradient(90deg,#6fae5b,#c5e48b); animation:ab-corre 1.1s ease-in-out infinite }
      @keyframes ab-entra{ from{ opacity:0; transform:scale(.82) } to{ opacity:1; transform:scale(1) } }
      @keyframes ab-brilho{ 0%,100%{ opacity:.55; transform:scale(.96) } 50%{ opacity:1; transform:scale(1.06) } }
      @keyframes ab-texto{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:none } }
      @keyframes ab-corre{ from{ transform:translateX(-110%) } to{ transform:translateX(260%) } }
      @media (prefers-reduced-motion: reduce){ #abertura *, #abertura *::before{ animation:none !important } }
    </style>
    <script>if (window.navigator.standalone) document.documentElement.classList.add("app-instalado");</script>
