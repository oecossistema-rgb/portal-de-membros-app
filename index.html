    <style>
      /* Logo exatamente no centro da tela: continua de onde a abertura do próprio Android/iPhone parou. */
      #abertura{ position:fixed; inset:0; z-index:2147483000; display:none; background:#050806; transition:opacity .8s ease, visibility .8s ease;
        font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif; overflow:hidden }
      @media (display-mode: standalone), (display-mode: fullscreen){ #abertura{ display:block } }
      html.app-instalado #abertura{ display:block }
      #abertura.saindo{ opacity:0; visibility:hidden }
      #abertura .ab-luz{ position:absolute; left:50%; top:50%; width:520px; height:520px; margin:-260px 0 0 -260px; border-radius:50%;
        background:radial-gradient(circle, rgba(120,200,90,.30) 0%, rgba(40,110,55,.14) 38%, rgba(5,8,6,0) 70%); animation:ab-luz 3.2s ease-in-out .3s infinite both }
      #abertura .ab-anel{ position:absolute; left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px; animation:ab-entra 1.6s cubic-bezier(.16,1,.3,1) both }
      #abertura .ab-logo{ width:100%; height:100%; display:block; filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)) }
      #abertura .ab-textos{ position:absolute; left:0; right:0; top:calc(50% + 104px); text-align:center }
      #abertura .ab-1{ color:#cfe7b8; letter-spacing:.62em; padding-left:.62em; font-size:12.5px; font-weight:600; animation:ab-texto 1.2s ease 1s both }
      #abertura .ab-2{ margin-top:8px; color:#fff; letter-spacing:.1em; padding-left:.1em; font-size:23px; font-weight:800; animation:ab-texto 1.2s ease 1.35s both }
      #abertura .ab-3{ margin-top:10px; color:rgba(207,231,184,.7); font-size:12px; letter-spacing:.04em; animation:ab-texto 1.2s ease 1.8s both }
      #abertura .ab-barra{ position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 56px); width:110px; margin-left:-55px; height:3px; border-radius:3px;
        background:rgba(255,255,255,.08); overflow:hidden; animation:ab-texto .8s ease 2s both }
      #abertura .ab-barra i{ display:block; width:40%; height:100%; border-radius:3px; background:linear-gradient(90deg,#6fae5b,#c5e48b); animation:ab-corre 1.5s ease-in-out infinite }
      @keyframes ab-entra{ 0%{ opacity:.85; transform:scale(.94) } 100%{ opacity:1; transform:scale(1) } }
      @keyframes ab-luz{ 0%,100%{ opacity:.6; transform:scale(.92) } 50%{ opacity:1; transform:scale(1.06) } }
      @keyframes ab-texto{ from{ opacity:0; transform:translateY(10px); filter:blur(4px) } to{ opacity:1; transform:none; filter:none } }
      @keyframes ab-corre{ from{ transform:translateX(-110%) } to{ transform:translateX(260%) } }
      @media (prefers-reduced-motion: reduce){ #abertura *, #abertura *::before{ animation:none !important } }
    </style>
