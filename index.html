    <!-- Tela de abertura do app instalado (some sozinha quando o portal carrega). -->
    <style>
      /* O logo nasce no centro (onde a tela do próprio sistema deixa), sobe com calma e os textos aparecem.
         A linha verde percorre de ponta a ponta enquanto o portal carrega. */
      #abertura{ position:fixed; inset:0; z-index:2147483000; display:none; background:#0b1f12;
        transition:opacity .9s ease, visibility .9s ease; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",system-ui,sans-serif; overflow:hidden }
      @media (display-mode: standalone), (display-mode: fullscreen){ #abertura{ display:block } }
      html.app-instalado #abertura{ display:block }
      #abertura.saindo{ opacity:0; visibility:hidden }
      #abertura::before{ content:""; position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 36%, #24522f 0%, #143520 45%, #0b1f12 100%); animation:ab-acende 1.4s ease .3s both }
      @keyframes ab-acende{ from{ opacity:0 } to{ opacity:1 } }
      #abertura .ab-palco{ position:absolute; left:0; right:0; top:50%; height:0; animation:ab-sobe 1.6s cubic-bezier(.65,0,.35,1) .5s both }
      #abertura .ab-luz{ position:absolute; left:50%; top:0; width:560px; height:560px; margin:-280px 0 0 -280px; border-radius:50%;
        background:radial-gradient(circle, rgba(150,225,110,.34) 0%, rgba(70,150,80,.16) 36%, rgba(11,31,18,0) 70%); animation:ab-luz 3.4s ease-in-out .4s infinite both }
      #abertura .ab-anel{ position:absolute; left:50%; top:0; width:150px; height:150px; margin:-75px 0 0 -75px }
      #abertura .ab-logo{ width:100%; height:100%; display:block; filter:drop-shadow(0 12px 30px rgba(0,0,0,.45)) }
      #abertura .ab-textos{ position:absolute; left:0; right:0; top:104px; text-align:center }
      #abertura .ab-1{ color:#d6efc2; letter-spacing:.62em; padding-left:.62em; font-size:12.5px; font-weight:600; animation:ab-texto 1.2s ease 1.5s both }
      #abertura .ab-2{ margin-top:8px; color:#fff; letter-spacing:.1em; padding-left:.1em; font-size:23px; font-weight:800; animation:ab-texto 1.2s ease 1.85s both }
      #abertura .ab-3{ margin-top:10px; color:rgba(214,239,194,.75); font-size:12px; letter-spacing:.04em; animation:ab-texto 1.2s ease 2.2s both }
      #abertura .ab-barra{ position:relative; margin:34px auto 0; width:180px; height:5px; border-radius:5px; background:rgba(255,255,255,.12); overflow:visible; animation:ab-texto .8s ease 2.2s both }
      #abertura .ab-barra i{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:5px; background:linear-gradient(90deg,#4f9a4c,#9fdc6e 70%,#e6ffcc);
        box-shadow:0 0 10px 1px rgba(170,240,120,.75), 0 0 22px 2px rgba(120,210,90,.45); animation:ab-enche 3.2s cubic-bezier(.45,0,.2,1) 2.4s both }
      @keyframes ab-sobe{ from{ transform:translateY(0) } to{ transform:translateY(-14vh) } }
      @keyframes ab-luz{ 0%,100%{ opacity:.65; transform:scale(.92) } 50%{ opacity:1; transform:scale(1.07) } }
      @keyframes ab-texto{ from{ opacity:0; transform:translateY(10px); filter:blur(4px) } to{ opacity:1; transform:none; filter:none } }
      @keyframes ab-enche{ from{ width:0 } to{ width:100% } }
      @media (prefers-reduced-motion: reduce){ #abertura *, #abertura *::before{ animation:none !important } #abertura .ab-palco{ transform:translateY(-14vh) } #abertura .ab-barra i{ width:100% } }
    </style>
    <script>if (window.navigator.standalone) document.documentElement.classList.add("app-instalado");</script>
